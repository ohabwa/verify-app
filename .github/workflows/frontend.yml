name: Frontend Deploy

on:
  push:
    branches:
      - master  # Staging deploys
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  release:
    types: [published]  # Production deploys on tags

jobs:
  # Staging deployment (on push to master/main)
  staging-deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run tests
        run: |
          cd frontend
          npm test || echo "No tests configured"

      - name: Build
        run: |
          cd frontend
          npm run build

      - name: Deploy to Vercel (Staging)
        if: secrets.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel
          vercel deploy --prod=false --token=$VERCEL_TOKEN
        continue-on-error: true

      - name: Log deployment info
        run: |
          echo "Frontend staging deployment complete."
          echo "Preview URL should be available in Vercel dashboard."

  # Production deployment (on release tag)
  production-deploy:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run tests
        run: |
          cd frontend
          npm test || echo "No tests configured"

      - name: Build
        run: |
          cd frontend
          npm run build

      - name: Deploy to Vercel (Production)
        if: secrets.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel
          vercel deploy --prod --token=$VERCEL_TOKEN
        continue-on-error: true

      - name: Create deployment summary
        if: github.event_name == 'release'
        run: |
          echo "## Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Version: ${{ github.event.release.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Released by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # Fallback: Manual deployment instructions
  manual-deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Print deployment instructions
        run: |
          echo "## Manual Deployment Required"
          echo ""
          echo "To deploy frontend manually:"
          echo "1. Go to https://vercel.com"
          echo "2. Import the verify-app repository"
          echo "3. Set root directory to 'frontend'"
          echo "4. Add NEXT_PUBLIC_API_URL environment variable"
          echo ""
          echo "For auto-deployment, set VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID secrets"